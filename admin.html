<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mentorias Bruno</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6600; --orange-dim: rgba(255,102,0,0.12);
    --bg: #0f0f0f; --surface: #181818; --surface2: #222;
    --border: #2a2a2a; --text: #f0f0f0; --muted: #666;
    --green: #22c55e; --green-dim: rgba(34,197,94,0.1);
    --red: #ef4444; --red-dim: rgba(239,68,68,0.1);
    --yellow: #f59e0b; --yellow-dim: rgba(245,158,11,0.1);
    --blue: #3b82f6; --blue-dim: rgba(59,130,246,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .app { display:grid; grid-template-columns:300px 1fr; min-height:100vh; }

  /* SIDEBAR */
  .sidebar { background:var(--surface); border-right:1px solid var(--border); padding:36px 28px; display:flex; flex-direction:column; gap:24px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand { display:flex; flex-direction:column; gap:4px; }
  .brand-tag { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--orange); }
  .brand-name { font-size:20px; font-weight:800; line-height:1.2; }
  .brand-sub { font-size:13px; color:var(--muted); margin-top:2px; }

  .stats { display:flex; flex-direction:column; gap:8px; }
  .stat-card { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  .stat-label { font-size:12px; color:var(--muted); font-weight:500; }
  .stat-value { font-size:22px; font-weight:800; color:var(--orange); }
  .stat-value.green { color:var(--green); }
  .stat-value.yellow { color:var(--yellow); }

  .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:10px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; }
  .field input, .field select {
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:14px; font-family:'Inter',sans-serif;
    color:var(--text); outline:none; transition:border-color 0.2s; width:100%;
  }
  .field input:focus, .field select:focus { border-color:var(--orange); }
  .field select option { background:#222; }
  .field input::placeholder { color:#444; }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .hint { font-size:11px; color:var(--muted); line-height:1.5; padding:10px 12px; background:var(--surface2); border-radius:8px; border:1px solid var(--border); }
  .hint strong { color:var(--orange); }

  .btn { border:none; border-radius:10px; padding:13px; font-size:13px; font-weight:700; cursor:pointer; width:100%; transition:opacity 0.2s; letter-spacing:0.3px; }
  .btn:hover { opacity:0.85; }
  .btn-orange { background:var(--orange); color:#fff; }
  .btn-green { background:var(--green-dim); color:var(--green); border:1px solid transparent; }
  .btn-ghost { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }

  .aviso { font-size:12px; padding:8px 12px; border-radius:8px; display:none; }
  .aviso.erro { color:var(--red); background:var(--red-dim); }
  .aviso.ok { color:var(--green); background:var(--green-dim); }

  .link-box { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .link-label { font-size:10px; font-weight:700; color:var(--orange); letter-spacing:2px; text-transform:uppercase; }
  .link-url { font-size:11px; color:var(--muted); word-break:break-all; line-height:1.4; }
  .btn-copy { background:var(--orange-dim); color:var(--orange); border:1px solid transparent; border-radius:8px; padding:8px; font-size:12px; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
  .btn-copy:hover { opacity:0.8; }

  .pagamento-status { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .ps-row { display:flex; justify-content:space-between; align-items:center; }
  .ps-label { font-size:12px; color:var(--muted); }
  .ps-value { font-size:14px; font-weight:700; color:var(--text); }
  .ps-value.orange { color:var(--orange); }
  .ps-value.green { color:var(--green); }

  /* MAIN */
  .main { padding:40px; overflow-y:auto; }
  .main-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px; padding-bottom:24px; border-bottom:1px solid var(--border); }
  .main-title { font-size:26px; font-weight:800; }
  .main-date { font-size:13px; color:var(--muted); }

  .tabs { display:flex; gap:4px; margin-bottom:28px; background:var(--surface); padding:4px; border-radius:12px; width:fit-content; border:1px solid var(--border); }
  .tab { padding:8px 20px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); transition:all 0.2s; border:none; background:none; }
  .tab.active { background:var(--orange); color:#fff; }

  .cards-grid { display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 24px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; position:relative; overflow:hidden; transition:border-color 0.2s; }
  .card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; }
  .card.disponivel::before { background:var(--orange); }
  .card.agendada::before { background:var(--green); }
  .card:hover { border-color:#333; }
  .card-left { display:flex; flex-direction:column; gap:8px; }
  .card-status { font-size:10px; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .card-status.orange { color:var(--orange); }
  .card-status.green { color:var(--green); }
  .card-name { font-size:17px; font-weight:700; display:flex; align-items:center; gap:10px; }
  .card-meta { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:4px 12px; font-size:12px; font-weight:600; color:var(--muted); }
  .chip.orange { background:var(--orange-dim); border-color:transparent; color:var(--orange); }
  .chip.green { background:var(--green-dim); border-color:transparent; color:var(--green); }
  .badge { font-size:10px; font-weight:800; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:1px; }
  .badge-hoje { background:var(--orange); color:#fff; }
  .badge-amanha { background:var(--orange-dim); color:var(--orange); }
  .card-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .btn-action { border:1px solid var(--border); border-radius:9px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; background:var(--surface2); color:var(--muted); transition:all 0.2s; white-space:nowrap; }
  .btn-action.del { background:var(--red-dim); color:var(--red); border-color:transparent; }
  .btn-action.agendar { background:var(--green-dim); color:var(--green); border-color:transparent; }
  .btn-action:hover { opacity:0.7; }

  /* DASHBOARD */
  .dash-section { margin-bottom:32px; }
  .dash-section-title { font-size:16px; font-weight:800; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  .dash-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px; }
  .dash-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:6px; }
  .dash-card-label { font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:1.5px; }
  .dash-card-value { font-size:28px; font-weight:900; color:var(--orange); line-height:1; }
  .dash-card-value.green { color:var(--green); }
  .dash-card-value.blue { color:var(--blue); }
  .dash-card-value.yellow { color:var(--yellow); }
  .dash-card-sub { font-size:12px; color:var(--muted); }
  .mes-input { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 12px; color:var(--text); font-family:'Inter',sans-serif; font-size:13px; font-weight:600; outline:none; cursor:pointer; }
  .mes-input:focus { border-color:var(--orange); }
  .dash-lista { display:flex; flex-direction:column; gap:8px; }
  .dash-item { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
  .dash-item-left { display:flex; flex-direction:column; gap:4px; }
  .dash-item-nome { font-size:14px; font-weight:700; }
  .dash-item-meta { font-size:12px; color:var(--muted); }
  .dash-item-valor { font-size:14px; font-weight:800; color:var(--green); }

  /* MODAL */
  #modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; }
  #modal-overlay.aberto { display:flex; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px; width:420px; max-width:92vw; }
  .modal-title { font-size:17px; font-weight:800; margin-bottom:4px; }
  .modal-slot { font-size:13px; color:var(--orange); font-weight:600; margin-bottom:24px; }
  .modal-actions { display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn { flex:1; }
  .modal-actions .btn-ghost { flex:0 0 auto; width:auto; padding:13px 22px; }

  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .icon { font-size:48px; margin-bottom:16px; }
  .empty p { font-size:15px; line-height:1.6; }
  .loading { text-align:center; padding:40px; color:var(--muted); font-size:14px; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:3px; }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator,
  input[type="month"]::-webkit-calendar-picker-indicator { filter:invert(0.5); cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-tag">Admin</span>
      <span class="brand-name">Agenda de<br>Mentorias</span>
      <span class="brand-sub">Bruno Ferracini</span>
    </div>

    <div class="stats" id="stats"><div class="loading">Carregando...</div></div>

    <!-- PAGAMENTO -->
    <div>
      <div class="section-title">Configuração de pagamento</div>
      <div class="row-2">
        <div class="field">
          <label>Valor Pix (R$)</label>
          <input type="number" id="preco" placeholder="300" min="1" oninput="calcularPrecoCard()" />
        </div>
        <div class="field">
          <label>Taxa cartão (%)</label>
          <input type="number" id="taxa" placeholder="4.98" min="0" step="0.01" oninput="calcularPrecoCard()" />
        </div>
      </div>
      <div class="hint" style="margin-bottom:10px;">Cartão = Pix ÷ (1 − taxa) · <strong id="preview-card">—</strong></div>
      <button class="btn btn-green" onclick="gerarLinkPagamento()" id="btn-gerar">⚡ Gerar links de pagamento</button>
      <div class="aviso" id="aviso-pagamento" style="margin-top:8px;"></div>

      <div class="pagamento-status" id="status-pagamento" style="margin-top:12px; display:none;">
        <div class="ps-row"><span class="ps-label">Pix</span><span class="ps-value green" id="ps-pix">—</span></div>
        <div class="ps-row"><span class="ps-label">Cartão</span><span class="ps-value orange" id="ps-card">—</span></div>
        <div class="ps-row"><span class="ps-label">Status</span><span class="ps-value green" id="ps-status">—</span></div>
      </div>
    </div>

    <!-- NOVO HORÁRIO -->
    <div>
      <div class="section-title">Novo horário disponível</div>
      <div class="hint"><strong>Regras:</strong> Sem quartas · Após 18h · Sáb de manhã · 1 por dia</div>
      <div style="margin-top:12px;">
        <div class="row-2">
          <div class="field">
            <label>Data</label>
            <input type="date" id="data" onchange="validarData()" />
          </div>
          <div class="field">
            <label>Horário</label>
            <select id="hora">
              <option value="">Selecione</option>
              <option value="18:00">18:00</option>
              <option value="19:00">19:00</option>
              <option value="20:00">20:00</option>
              <option value="21:00">21:00</option>
              <option value="09:00">09:00 (sáb)</option>
              <option value="10:00">10:00 (sáb)</option>
              <option value="11:00">11:00 (sáb)</option>
            </select>
          </div>
        </div>
        <div id="aviso-data" class="aviso erro" style="margin-bottom:10px;"></div>
        <button class="btn btn-orange" onclick="adicionarSlot()">+ Liberar horário</button>
      </div>
    </div>

    <!-- LINK CLIENTE -->
    <div class="link-box">
      <div class="link-label">Link para o cliente</div>
      <div class="link-url" id="link-cliente">—</div>
      <button class="btn-copy" onclick="copiarLink()">Copiar link</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div class="main-title">Horários e reservas</div>
      <div class="main-date" id="dataHoje"></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setTab('disponiveis',this)">Disponíveis</button>
      <button class="tab" onclick="setTab('agendadas',this)">Agendadas</button>
      <button class="tab" onclick="setTab('todos',this)">Todos</button>
      <button class="tab" onclick="setTab('dashboard',this)">Dashboard</button>
    </div>
    <div id="lista"><div class="loading">Conectando...</div></div>
  </main>
</div>

<!-- MODAL AGENDAR MANUALMENTE -->
<div id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">Agendar manualmente</div>
    <div class="modal-slot" id="modal-slot-info"></div>
    <div class="field">
      <label>Nome do cliente</label>
      <input type="text" id="modal-nome" placeholder="Ex: João Silva" />
    </div>
    <div class="field">
      <label>WhatsApp</label>
      <input type="tel" id="modal-tel" placeholder="Ex: (11) 99999-9999" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-orange" id="btn-confirmar-modal" onclick="confirmarAgendamentoManual()">Confirmar agendamento</button>
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  const DB = 'https://mentorias-bruno-default-rtdb.firebaseio.com';
  const URL_BASE = 'https://brunesk.github.io/mentorias-agenda';
  const MP_TOKEN = localStorage.getItem('mp_token') || '';
  let tabAtual = 'disponiveis';
  let todosSlots = {};
  let configAtual = {};
  let slotParaAgendar = null;

  const hoje = new Date();
  let mesDashboard = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;

  document.getElementById('link-cliente').textContent = URL_BASE + '/agendar.html';

  function copiarLink() {
    navigator.clipboard.writeText(URL_BASE + '/agendar.html');
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = 'Copiar link', 2000);
  }

  function calcularPrecoCard() {
    const preco = parseFloat(document.getElementById('preco').value) || 0;
    const taxa  = parseFloat(document.getElementById('taxa').value) || 0;
    if (!preco || !taxa) { document.getElementById('preview-card').textContent = '—'; return 0; }
    const card = Math.round((preco / (1 - taxa / 100)) * 100) / 100;
    document.getElementById('preview-card').textContent = `Cartão = R$ ${card.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
    return card;
  }

  async function carregarConfig() {
    const res = await fetch(`${DB}/config.json`);
    configAtual = (await res.json()) || {};
    if (configAtual.preco) {
      document.getElementById('preco').value = configAtual.preco;
      if (configAtual.taxa) document.getElementById('taxa').value = configAtual.taxa;
      calcularPrecoCard();
      document.getElementById('ps-pix').textContent  = 'R$ ' + parseFloat(configAtual.pixPreco || configAtual.preco).toLocaleString('pt-BR', {minimumFractionDigits:2});
      document.getElementById('ps-card').textContent = configAtual.cardPreco ? 'R$ ' + parseFloat(configAtual.cardPreco).toLocaleString('pt-BR', {minimumFractionDigits:2}) : '—';
      document.getElementById('ps-status').textContent = (configAtual.pixUrl || configAtual.checkoutUrl) ? '✓ Links ativos' : 'Sem links';
      document.getElementById('status-pagamento').style.display = 'flex';
      document.getElementById('status-pagamento').style.flexDirection = 'column';
    }
  }

  async function criarPreferencia(preco, excluir) {
    const res = await fetch('https://api.mercadopago.com/checkout/preferences', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${MP_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: [{ title: 'Mentoria — Acelera Shopee', quantity: 1, unit_price: preco, currency_id: 'BRL' }],
        back_urls: { success: `${URL_BASE}/agendar.html`, failure: `${URL_BASE}/agendar.html`, pending: `${URL_BASE}/agendar.html` },
        auto_return: 'approved',
        statement_descriptor: 'MENTORIA SHOPEE',
        payment_methods: { excluded_payment_types: excluir.map(id => ({id})) }
      })
    });
    const data = await res.json();
    if (!data.init_point) throw new Error('Erro ao criar preferência');
    return data;
  }

  async function gerarLinkPagamento() {
    const preco = parseFloat(document.getElementById('preco').value);
    const taxa  = parseFloat(document.getElementById('taxa').value);
    if (!preco || preco < 1) { mostrarAviso('aviso-pagamento', 'Digite o valor do Pix!', 'erro'); return; }
    if (!taxa  || taxa < 0)  { mostrarAviso('aviso-pagamento', 'Digite a taxa do cartão!', 'erro'); return; }
    const precoCard = Math.round((preco / (1 - taxa / 100)) * 100) / 100;
    const btn = document.getElementById('btn-gerar');
    btn.textContent = 'Gerando...'; btn.disabled = true;
    try {
      const [pix, card] = await Promise.all([
        criarPreferencia(preco,     ['credit_card', 'debit_card', 'ticket', 'prepaid_card']),
        criarPreferencia(precoCard, ['bank_transfer', 'ticket', 'prepaid_card'])
      ]);
      await fetch(`${DB}/config.json`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          preco, taxa,
          pixPreco: preco,   pixUrl: pix.init_point,   pixId: pix.id,
          cardPreco: precoCard, cardUrl: card.init_point, cardId: card.id,
          checkoutUrl: pix.init_point,
          mpToken: MP_TOKEN, atualizadoEm: Date.now()
        })
      });
      document.getElementById('ps-pix').textContent  = 'R$ ' + preco.toLocaleString('pt-BR', {minimumFractionDigits:2});
      document.getElementById('ps-card').textContent = 'R$ ' + precoCard.toLocaleString('pt-BR', {minimumFractionDigits:2});
      document.getElementById('ps-status').textContent = '✓ Links ativos';
      document.getElementById('status-pagamento').style.display = 'flex';
      document.getElementById('status-pagamento').style.flexDirection = 'column';
      mostrarAviso('aviso-pagamento', '✓ Links gerados com sucesso!', 'ok');
    } catch(e) {
      mostrarAviso('aviso-pagamento', 'Erro ao gerar links. Tente novamente.', 'erro');
    }
    btn.textContent = '⚡ Gerar links de pagamento'; btn.disabled = false;
  }

  function mostrarAviso(id, msg, tipo) {
    const el = document.getElementById(id);
    el.textContent = msg; el.className = 'aviso ' + tipo; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  async function carregarSlots() {
    try {
      const res = await fetch(`${DB}/slots.json`);
      todosSlots = (await res.json()) || {};
      render();
    } catch(e) {}
  }

  async function adicionarSlot() {
    const data = document.getElementById('data').value;
    const hora = document.getElementById('hora').value;
    if (!data || !hora) { alert('Selecione data e horário!'); return; }
    const d = new Date(data + 'T00:00:00');
    const dia = d.getDay();
    if (dia === 3) { alert('Bruno não dá mentoria às quartas!'); return; }
    const h = parseInt(hora.split(':')[0]);
    if (dia === 6) { if (h >= 13) { alert('Sábado só de manhã!'); return; } }
    else { if (h < 18) { alert('Apenas após 18h!'); return; } }
    const jaTemNaData = Object.values(todosSlots).some(s => s.data === data);
    if (jaTemNaData) { alert('Já existe horário para essa data!'); return; }
    await fetch(`${DB}/slots.json`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data, hora, disponivel: true, clienteNome: null, clienteTel: null, criadoEm: Date.now() })
    });
    document.getElementById('data').value = '';
    document.getElementById('hora').value = '';
    carregarSlots();
  }

  async function deletarSlot(id) {
    if (!confirm('Remover este horário?')) return;
    await fetch(`${DB}/slots/${id}.json`, { method: 'DELETE' });
    carregarSlots();
  }

  // ─── AGENDAR MANUALMENTE ───────────────────────────────────────────
  function abrirModalAgendar(id, data, hora) {
    slotParaAgendar = { id, data, hora };
    document.getElementById('modal-slot-info').textContent = `📅 ${diaSemanaFull(data)}, ${fmt(data)} às 🕐 ${hora}`;
    document.getElementById('modal-nome').value = '';
    document.getElementById('modal-tel').value = '';
    document.getElementById('modal-overlay').classList.add('aberto');
    setTimeout(() => document.getElementById('modal-nome').focus(), 100);
  }

  function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('aberto');
    slotParaAgendar = null;
  }

  async function confirmarAgendamentoManual() {
    const nome = document.getElementById('modal-nome').value.trim();
    const tel  = document.getElementById('modal-tel').value.trim();
    if (!nome || !tel) { alert('Preencha nome e WhatsApp!'); return; }
    const btn = document.getElementById('btn-confirmar-modal');
    btn.disabled = true; btn.textContent = 'Confirmando...';
    try {
      await fetch(`${DB}/slots/${slotParaAgendar.id}.json`, {
        method: 'PATCH', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ disponivel: false, clienteNome: nome, clienteTel: tel, agendadoEm: Date.now() })
      });
      fecharModal();
      await carregarSlots();
    } catch(e) {
      alert('Erro ao agendar. Tente novamente.');
    }
    btn.disabled = false; btn.textContent = 'Confirmar agendamento';
  }

  // Fecha modal clicando fora
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });

  // ─── VALIDAÇÃO ────────────────────────────────────────────────────
  function validarData() {
    const data = document.getElementById('data').value;
    if (!data) return;
    const d = new Date(data + 'T00:00:00');
    const aviso = document.getElementById('aviso-data');
    if (d.getDay() === 3) { aviso.textContent = '⚠️ Quarta-feira — Bruno não dá mentoria.'; aviso.style.display = 'block'; }
    else aviso.style.display = 'none';
  }

  // ─── RENDER ───────────────────────────────────────────────────────
  function fmt(d) { const [a,m,dia] = d.split('-'); return `${dia}/${m}/${a}`; }
  function diaSemana(d) { return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(d+'T00:00:00').getDay()]; }
  function diaSemanaFull(d) { return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][new Date(d+'T00:00:00').getDay()]; }
  function getBadge(d) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const diff = Math.round((new Date(d+'T00:00:00') - hoje) / 86400000);
    if (diff === 0) return '<span class="badge badge-hoje">Hoje</span>';
    if (diff === 1) return '<span class="badge badge-amanha">Amanhã</span>';
    return '';
  }

  function setTab(tab, el) {
    tabAtual = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  function renderStats() {
    const slots = Object.values(todosSlots);
    const disp  = slots.filter(s => s.disponivel).length;
    const agend = slots.filter(s => !s.disponivel).length;
    const hj = new Date(); hj.setHours(0,0,0,0);
    const hoje = slots.filter(s => new Date(s.data+'T00:00:00').getTime() === hj.getTime()).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><span class="stat-label">Disponíveis</span><span class="stat-value">${disp}</span></div>
      <div class="stat-card"><span class="stat-label">Agendadas</span><span class="stat-value green">${agend}</span></div>
      <div class="stat-card"><span class="stat-label">Hoje</span><span class="stat-value yellow">${hoje}</span></div>`;
  }

  function renderDashboard() {
    const slots  = Object.values(todosSlots);
    const preco  = parseFloat(configAtual.preco) || 0;
    const precoFmt = v => v > 0 ? 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2}) : '—';

    // Dados do mês selecionado
    const [anoSel, mesSel] = mesDashboard.split('-');
    const doMes    = slots.filter(s => { const [a,m] = s.data.split('-'); return a === anoSel && m === mesSel && !s.disponivel; });
    const fatMes   = doMes.length * preco;

    // Dados gerais
    const agendadas  = slots.filter(s => !s.disponivel);
    const realizadas = agendadas.filter(s => new Date(s.data+'T23:59:59') < new Date());
    const futuras    = agendadas.filter(s => new Date(s.data+'T00:00:00') >= new Date(new Date().toDateString()));
    const totalFat   = agendadas.length * preco;

    // Meses únicos com mentorias
    const mesesAtivos = new Set(agendadas.map(s => s.data.substring(0,7))).size || 1;
    const media       = agendadas.length / mesesAtivos;

    document.getElementById('lista').innerHTML = `
      <!-- ── MENSAL ── -->
      <div class="dash-section">
        <div class="dash-section-title">
          📅 Dashboard Mensal
          <input type="month" class="mes-input" value="${mesDashboard}" onchange="atualizarMes(this.value)" />
        </div>
        <div class="dash-grid">
          <div class="dash-card">
            <div class="dash-card-label">Mentorias no mês</div>
            <div class="dash-card-value green">${doMes.length}</div>
            <div class="dash-card-sub">${doMes.length === 1 ? '1 sessão' : doMes.length + ' sessões'}</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-label">Faturamento estimado</div>
            <div class="dash-card-value" style="font-size:${fatMes >= 1000 ? '20px' : '28px'}">${precoFmt(fatMes)}</div>
            <div class="dash-card-sub">R$ ${preco || '—'} × ${doMes.length} mentoria${doMes.length !== 1 ? 's' : ''}</div>
          </div>
        </div>
        ${doMes.length === 0
          ? `<div class="empty" style="padding:30px;"><div class="icon">📭</div><p>Nenhuma mentoria neste mês.</p></div>`
          : `<div class="dash-lista">${doMes.sort((a,b) => a.data.localeCompare(b.data)).map(s => `
              <div class="dash-item">
                <div class="dash-item-left">
                  <div class="dash-item-nome">${s.clienteNome || 'Cliente sem nome'}</div>
                  <div class="dash-item-meta">📅 ${diaSemanaFull(s.data)}, ${fmt(s.data)} · 🕐 ${s.hora}${s.clienteTel ? ' · 📱 ' + s.clienteTel : ''}</div>
                </div>
                <div class="dash-item-valor">${precoFmt(preco)}</div>
              </div>`).join('')}</div>`
        }
      </div>

      <!-- ── GERAL ── -->
      <div class="dash-section">
        <div class="dash-section-title">📊 Dashboard Geral</div>
        <div class="dash-grid">
          <div class="dash-card">
            <div class="dash-card-label">Total de mentorias</div>
            <div class="dash-card-value">${agendadas.length}</div>
            <div class="dash-card-sub">desde o início</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-label">Faturamento total</div>
            <div class="dash-card-value green" style="font-size:${totalFat >= 10000 ? '18px' : '24px'}">${precoFmt(totalFat)}</div>
            <div class="dash-card-sub">estimado</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-label">Já realizadas</div>
            <div class="dash-card-value blue">${realizadas.length}</div>
            <div class="dash-card-sub">datas passadas</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-label">A realizar</div>
            <div class="dash-card-value yellow">${futuras.length}</div>
            <div class="dash-card-sub">próximas sessões</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-label">Média mensal</div>
            <div class="dash-card-value" style="font-size:22px;">${media.toFixed(1)}</div>
            <div class="dash-card-sub">mentorias/mês</div>
          </div>
          <div class="dash-card">
            <div class="dash-card-label">Meses ativos</div>
            <div class="dash-card-value" style="color:var(--muted); font-size:22px;">${mesesAtivos}</div>
            <div class="dash-card-sub">com atividade</div>
          </div>
        </div>
      </div>`;
  }

  function atualizarMes(valor) {
    mesDashboard = valor;
    renderDashboard();
  }

  function render() {
    renderStats();
    if (tabAtual === 'dashboard') { renderDashboard(); return; }

    let slots = Object.entries(todosSlots).map(([id,s]) => ({id,...s})).sort((a,b) => (a.data+a.hora).localeCompare(b.data+b.hora));
    if (tabAtual === 'disponiveis') slots = slots.filter(s => s.disponivel);
    if (tabAtual === 'agendadas')   slots = slots.filter(s => !s.disponivel);

    const lista = document.getElementById('lista');
    if (slots.length === 0) {
      lista.innerHTML = `<div class="empty"><div class="icon">📭</div><p>${tabAtual === 'disponiveis' ? 'Nenhum horário disponível.' : 'Nenhuma mentoria agendada.'}</p></div>`;
      return;
    }
    lista.innerHTML = `<div class="cards-grid">${slots.map(s => `
      <div class="card ${s.disponivel ? 'disponivel' : 'agendada'}">
        <div class="card-left">
          <div class="card-status ${s.disponivel ? 'orange' : 'green'}">${s.disponivel ? 'Disponível' : 'Agendada'}</div>
          <div class="card-name">${s.disponivel ? 'Horário livre' : s.clienteNome} ${getBadge(s.data)}</div>
          <div class="card-meta">
            <div class="chip orange">📅 ${diaSemana(s.data)}, ${fmt(s.data)}</div>
            <div class="chip orange">🕐 ${s.hora}</div>
            ${!s.disponivel && s.clienteTel ? `<div class="chip green">📱 ${s.clienteTel}</div>` : ''}
          </div>
        </div>
        <div class="card-actions">
          ${s.disponivel ? `<button class="btn-action agendar" onclick="abrirModalAgendar('${s.id}','${s.data}','${s.hora}')">+ Agendar</button>` : ''}
          <button class="btn-action del" onclick="deletarSlot('${s.id}')">Remover</button>
        </div>
      </div>`).join('')}</div>`;
  }

  const d = new Date();
  document.getElementById('dataHoje').textContent = d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  if (!localStorage.getItem('mp_token')) {
    const token = prompt('Cole aqui o seu Access Token do Mercado Pago (começa com APP_USR-):');
    if (token && token.startsWith('APP_USR-')) {
      localStorage.setItem('mp_token', token);
      location.reload();
    } else if (token) {
      alert('Token inválido. Recarregue a página e tente novamente.');
    }
  }

  carregarConfig();
  carregarSlots();
  setInterval(carregarSlots, 15000);
</script>
</body>
</html>
