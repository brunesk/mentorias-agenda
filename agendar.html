<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar Mentoria — Bruno Ferracini</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6600;
    --orange-dim: rgba(255,102,0,0.1);
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #222;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .page { max-width: 480px; margin: 0 auto; padding: 40px 20px 60px; }

  /* HEADER */
  .header { text-align: center; margin-bottom: 40px; }
  .header .logo {
    width: 56px; height: 56px; background: var(--orange);
    border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 24px; margin: 0 auto 20px;
  }
  .header h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .header p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .header .tag {
    display: inline-block; background: var(--orange-dim);
    color: var(--orange); font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 5px 14px; border-radius: 20px; margin-bottom: 16px;
  }

  /* SLOTS */
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px;
  }

  .slots-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }

  .slot {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: 14px; padding: 18px 20px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.2s;
  }
  .slot:hover { border-color: var(--orange); background: #1c1c1c; }
  .slot.selected { border-color: var(--orange); background: var(--orange-dim); }

  .slot-left { display: flex; flex-direction: column; gap: 6px; }
  .slot-dia { font-size: 16px; font-weight: 700; }
  .slot-data { font-size: 13px; color: var(--muted); font-weight: 500; }

  .slot-hora {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; color: var(--orange);
  }
  .slot.selected .slot-hora { background: var(--orange); color: #fff; border-color: transparent; }

  .badge-hoje {
    font-size: 10px; font-weight: 800; background: var(--orange);
    color: #fff; padding: 2px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 1px; margin-left: 8px;
  }
  .badge-amanha {
    font-size: 10px; font-weight: 800; background: var(--orange-dim);
    color: var(--orange); padding: 2px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 1px; margin-left: 8px;
  }

  /* FORM */
  .form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 16px;
    display: none;
  }
  .form-card.visible { display: block; }
  .form-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .field input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 14px;
    font-size: 15px; font-family: 'Inter', sans-serif;
    color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--orange); }
  .field input::placeholder { color: #444; }

  .resumo {
    background: var(--orange-dim); border: 1px solid rgba(255,102,0,0.2);
    border-radius: 10px; padding: 14px; margin-bottom: 16px;
    font-size: 13px; color: var(--text); line-height: 1.6;
  }
  .resumo strong { color: var(--orange); }

  .btn-confirmar {
    background: var(--orange); color: #fff; border: none;
    border-radius: 10px; padding: 15px; font-size: 15px;
    font-weight: 700; cursor: pointer; width: 100%;
    transition: opacity 0.2s;
  }
  .btn-confirmar:hover { opacity: 0.88; }
  .btn-confirmar:disabled { opacity: 0.4; cursor: not-allowed; }

  /* SUCESSO */
  .sucesso {
    display: none; text-align: center; padding: 40px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px;
  }
  .sucesso.visible { display: block; }
  .sucesso .icon { font-size: 56px; margin-bottom: 20px; }
  .sucesso h2 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
  .sucesso p { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .sucesso .detail {
    background: var(--orange-dim); border-radius: 12px;
    padding: 16px; margin: 20px 0; text-align: left;
    font-size: 14px; line-height: 1.8;
  }
  .sucesso .detail strong { color: var(--orange); }

  /* EMPTY / LOADING */
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty .icon { font-size: 44px; margin-bottom: 16px; }
  .empty p { font-size: 14px; line-height: 1.7; }

  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="logo">🎯</div>
    <div class="tag">Acelera Shopee</div>
    <h1>Agende sua mentoria</h1>
    <p>Escolha o melhor dia e horário<br>para a sua mentoria com o Bruno.</p>
  </div>

  <div id="conteudo">
    <div class="loading">Carregando horários disponíveis...</div>
  </div>

</div>

<script>
  const DB = 'https://mentorias-bruno-default-rtdb.firebaseio.com/slots';
  let slotSelecionado = null;
  let todosSlots = {};

  function fmt(dataStr) {
    const [a,m,d] = dataStr.split('-');
    return `${d}/${m}/${a}`;
  }

  function diaSemanaFull(dataStr) {
    const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    return dias[new Date(dataStr + 'T00:00:00').getDay()];
  }

  function getBadge(dataStr) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const d = new Date(dataStr + 'T00:00:00');
    const diff = Math.round((d - hoje) / 86400000);
    if (diff === 0) return '<span class="badge-hoje">Hoje</span>';
    if (diff === 1) return '<span class="badge-amanha">Amanhã</span>';
    return '';
  }

  async function carregarSlots() {
    try {
      const res = await fetch(`${DB}.json`);
      todosSlots = (await res.json()) || {};
      renderSlots();
    } catch(e) {
      document.getElementById('conteudo').innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>Erro ao carregar horários.<br>Verifique sua conexão.</p></div>';
    }
  }

  function renderSlots() {
    const disponiveis = Object.entries(todosSlots)
      .filter(([_, s]) => s.disponivel)
      .map(([id, s]) => ({ id, ...s }))
      .sort((a,b) => (a.data+a.hora).localeCompare(b.data+b.hora));

    const conteudo = document.getElementById('conteudo');

    if (disponiveis.length === 0) {
      conteudo.innerHTML = `
        <div class="empty">
          <div class="icon">📭</div>
          <p>Nenhum horário disponível no momento.<br>Novos horários são divulgados nos Stories do<br><strong style="color:var(--orange)">@brunoferracini</strong></p>
        </div>`;
      return;
    }

    conteudo.innerHTML = `
      <div class="section-title">Horários disponíveis</div>
      <div class="slots-grid" id="slots-grid">
        ${disponiveis.map(s => `
          <div class="slot" id="slot-${s.id}" onclick="selecionarSlot('${s.id}', '${s.data}', '${s.hora}')">
            <div class="slot-left">
              <div class="slot-dia">${diaSemanaFull(s.data)} ${getBadge(s.data)}</div>
              <div class="slot-data">📅 ${fmt(s.data)}</div>
            </div>
            <div class="slot-hora">🕐 ${s.hora}</div>
          </div>`).join('')}
      </div>

      <div class="form-card" id="form-card">
        <h3>Confirmar agendamento</h3>
        <div class="resumo" id="resumo"></div>
        <div class="field">
          <label>Seu nome completo</label>
          <input type="text" id="nome" placeholder="Ex: João Silva" />
        </div>
        <div class="field">
          <label>WhatsApp</label>
          <input type="tel" id="tel" placeholder="Ex: (11) 99999-9999" />
        </div>
        <button class="btn-confirmar" onclick="confirmar()">Confirmar agendamento</button>
      </div>

      <div class="sucesso" id="sucesso">
        <div class="icon">✅</div>
        <h2>Agendado com sucesso!</h2>
        <div class="detail" id="detalhe-sucesso"></div>
        <p>O Bruno entrará em contato pelo WhatsApp para confirmar. Fique atento!</p>
      </div>`;
  }

  function selecionarSlot(id, data, hora) {
    slotSelecionado = { id, data, hora };
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
    document.getElementById('slot-' + id).classList.add('selected');

    const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const diaSemana = dias[new Date(data + 'T00:00:00').getDay()];
    const [a,m,d] = data.split('-');

    document.getElementById('resumo').innerHTML = `<strong>📅 Data:</strong> ${diaSemana}, ${d}/${m}/${a}<br><strong>🕐 Horário:</strong> ${hora}`;
    document.getElementById('form-card').classList.add('visible');
    document.getElementById('form-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function confirmar() {
    const nome = document.getElementById('nome').value.trim();
    const tel  = document.getElementById('tel').value.trim();
    if (!nome || !tel) { alert('Preencha seu nome e WhatsApp!'); return; }
    if (!slotSelecionado) { alert('Selecione um horário!'); return; }

    const btn = document.querySelector('.btn-confirmar');
    btn.disabled = true;
    btn.textContent = 'Confirmando...';

    try {
      await fetch(`${DB}/${slotSelecionado.id}.json`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ disponivel: false, clienteNome: nome, clienteTel: tel, agendadoEm: Date.now() })
      });

      const [a,m,d] = slotSelecionado.data.split('-');
      const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
      const diaSemana = dias[new Date(slotSelecionado.data + 'T00:00:00').getDay()];

      document.getElementById('detalhe-sucesso').innerHTML =
        `<strong>Nome:</strong> ${nome}<br><strong>Data:</strong> ${diaSemana}, ${d}/${m}/${a}<br><strong>Horário:</strong> ${slotSelecionado.hora}<br><strong>WhatsApp:</strong> ${tel}`;

      document.getElementById('slots-grid').style.display = 'none';
      document.querySelector('.section-title').style.display = 'none';
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('sucesso').classList.add('visible');

    } catch(e) {
      alert('Erro ao confirmar. Tente novamente.');
      btn.disabled = false;
      btn.textContent = 'Confirmar agendamento';
    }
  }

  carregarSlots();
</script>
</body>
</html>
